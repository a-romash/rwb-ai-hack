<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Поток — Студия ИИ-пайплайна</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Студия агентского ИИ-пайплайна: от бизнес-требований до работающего прототипа">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#FCFCFD" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
  </head>
  <body>
    <script>
      // Тема до старта Angular: без вспышки светлого фона у тех, кто выбрал тёмную.
      try {
        var saved = localStorage.getItem('tuiDark');
        var dark = saved ? saved === 'true' : matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.body.setAttribute('tuiTheme', 'dark');
      } catch (e) {}
    </script>
    <app-root></app-root>
    <noscript>Для работы Студии нужен JavaScript.</noscript>
  </body>
</html>
