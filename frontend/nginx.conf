server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Готовность к потоковым ответам (SSE): без буферизации и с долгим чтением
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Сборка Angular кладёт хэш в имена файлов — их можно кэшировать надолго
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico|webp)$ {
        try_files $uri =404;
        expires 1y;
    }

    # index.html всегда свежий, чтобы после выкладки подтянулись новые бандлы
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
