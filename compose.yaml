name: rwb-pipeline

# All backend services share one image. Only `api` builds it: several services building the same
# tag in parallel fail with "image already exists". Workers reuse the image built by `api`.
x-backend: &backend
  image: rwb-pipeline-backend:local
  pull_policy: never
  env_file:
    - path: .env
      required: false
  # One owner for the run workspaces: API creates them, llm and build workers write into them,
  # and git refuses repositories owned by another user. The build worker needs the Docker socket,
  # which is root access to the host anyway, so the services run as root.
  user: "0:0"
  environment: &backend-environment
    POSTGRES_USER: ${POSTGRES_USER:-pipeline}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
    POSTGRES_DB: ${POSTGRES_DB:-pipeline}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    WORKSPACES_DIR: /app/workspaces
    # Host path of ./workspaces for Docker sandbox mounts; detected from the container mounts when empty.
    HOST_WORKSPACES_DIR: ${HOST_WORKSPACES_DIR:-}
    PIPELINE_FAKE_STAGES: ${PIPELINE_FAKE_STAGES:-0}
    # Model endpoint (harness/llm_config.py): OpenRouter by default, or any OpenAI-compatible server.
    LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-qwen/qwen3.8-27b}
    LLM_PROVIDER: ${LLM_PROVIDER-DeepInfra}
    PROTOTYPE_ENABLED: ${PROTOTYPE_ENABLED:-0}
    PROTOTYPE_PUBLIC_PATH: ${PROTOTYPE_PUBLIC_PATH:-/agent-prototype/}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  volumes:
    - ./workspaces:/app/workspaces
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    pull_policy: build
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "alembic upgrade head && python -m app.init_broker && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker-llm:
    <<: *backend
    command: ["celery", "-A", "app.tasks:celery_app", "worker", "-Q", "llm,celery", "--loglevel=info", "--concurrency=1", "--without-gossip", "--without-mingle"]
    depends_on:
      api:
        condition: service_healthy

  worker-build:
    <<: *backend
    volumes:
      - ./workspaces:/app/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["celery", "-A", "app.tasks:celery_app", "worker", "-Q", "build", "--loglevel=info", "--concurrency=1", "--without-gossip", "--without-mingle"]
    depends_on:
      api:
        condition: service_healthy

  worker-io:
    <<: *backend
    command: ["celery", "-A", "app.tasks:celery_app", "worker", "-Q", "io", "--loglevel=info", "--concurrency=1", "--without-gossip", "--without-mingle"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Images of the build sandbox and the product CI (templates/product/pack.json).
  # Build once: docker compose --profile tools build
  tool-dotnet:
    profiles: [tools]
    image: rwb/tool-dotnet:10
    build:
      context: templates/product/tools
      dockerfile: Dockerfile.dotnet

  tool-node:
    profiles: [tools]
    image: rwb/tool-node:22
    build:
      context: templates/product/tools
      dockerfile: Dockerfile.node

  tool-security:
    profiles: [tools]
    image: rwb/tool-security:1
    build:
      context: templates/product/tools
      dockerfile: Dockerfile.security

volumes:
  postgres_data:
