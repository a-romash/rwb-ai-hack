name: rwb-prototype
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    working_dir: /app
    entrypoint: ["dotnet", "App.Api.dll"]
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=app;Username=app;Password=app
      ASPNETCORE_HTTP_PORTS: "8080"
    volumes:
      - ${PROTOTYPE_DIR:?Set PROTOTYPE_DIR to the host .prototype directory}/current/backend:/app:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "dotnet", "App.Api.dll", "--healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
  worker:
    image: mcr.microsoft.com/dotnet/aspnet:10.0
    working_dir: /app
    entrypoint: ["dotnet", "App.Worker.dll"]
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=app;Username=app;Password=app
    volumes:
      - ${PROTOTYPE_DIR:?Set PROTOTYPE_DIR to the host .prototype directory}/current/worker:/app:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  admin:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ${PROTOTYPE_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PROTOTYPE_DIR}/current/admin:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      mobile:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  mobile:
    image: nginx:1.28-alpine
    volumes:
      - ${PROTOTYPE_DIR}/mobile.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PROTOTYPE_DIR}/current/mobile:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
